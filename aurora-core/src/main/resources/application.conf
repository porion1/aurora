# =====================================================
# Aurora Tenant Service Configuration
# =====================================================

app {
  name = "Aurora Tenant Service"
  version = "1.0.0"
  environment = "development"    # options: development, staging, production
}

# -----------------------------------------------------
# MongoDB configuration
# -----------------------------------------------------
mongodb {
  host = "localhost"
  port = 27017
  database = "aurora_mvp"
}

# -----------------------------------------------------
# HTTP server configuration
# -----------------------------------------------------
http {
  host = "0.0.0.0"
  port = 8099
}

# -----------------------------------------------------
# Logging configuration (optional, if using logback)
# -----------------------------------------------------
logging {
  level = "INFO"                  # TRACE, DEBUG, INFO, WARN, ERROR
}
