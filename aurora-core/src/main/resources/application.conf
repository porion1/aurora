# =====================================================
# Aurora Tenant Service Configuration
# =====================================================

app {
  name = "Aurora Tenant Service"
  version = "1.0.0"
  environment = "development"    # options: development, staging, production
}

# -----------------------------------------------------
# MongoDB configuration
# -----------------------------------------------------
mongodb {
  host = "localhost"
  port = 27017
  database = "aurora_mvp"
}

# -----------------------------------------------------
# HTTP server configuration
# -----------------------------------------------------
http {
  host = "0.0.0.0"
  port = 8099
}

# -----------------------------------------------------
# Logging configuration (optional, if using logback)
# -----------------------------------------------------
logging {
  level = "INFO"                  # TRACE, DEBUG, INFO, WARN, ERROR
}

# =====================================================
# Analytics Configuration
# =====================================================

analytics {

  # -----------------------------------------------------
  # Buffer Configuration
  # -----------------------------------------------------
  buffer {
    # Size of ring buffers per tenant (must be power of 2)
    size = 16384
    # Default sampling rate for unknown tiers
    default-sampling-rate = 0.1
  }

  # -----------------------------------------------------
  # Retention Periods (in days)
  # -----------------------------------------------------
  retention {
    raw-events = 7      # Raw events retained for 7 days
    minute-metrics = 30 # Minute-level aggregates for 30 days
    hour-metrics = 90   # Hour-level aggregates for 90 days
    day-metrics = 365   # Day-level aggregates for 1 year
  }

  # -----------------------------------------------------
  # Cache Configuration
  # -----------------------------------------------------
  cache {
    # Dashboard cache TTL in minutes
    dashboard-ttl-minutes = 5
    # Query cache TTL in minutes
    query-ttl-minutes = 5
    # Maximum cache size
    max-size = 1000
  }

  # -----------------------------------------------------
  # Aggregation Configuration
  # -----------------------------------------------------
  aggregation {
    # Slow request threshold in milliseconds
    slow-request-threshold-ms = 1000
    # Top endpoints limit
    top-endpoints-limit = 10
    # Batch size for processing
    batch-size = 1000
  }

  # -----------------------------------------------------
  # Anomaly Detection Configuration
  # -----------------------------------------------------
  anomaly {
    # Z-Score thresholds
    zscore-medium = 3.0
    zscore-high = 5.0

    # Historical baseline thresholds
    historical-medium = 2.5
    historical-high = 4.0

    # Minimum data points for baseline
    min-baseline-points = 10

    # IQR multiplier
    iqr-multiplier = 1.5

    # Rate change factors
    rate-change-medium = 3.0
    rate-change-high = 5.0
  }

  # -----------------------------------------------------
  # Alert Configuration
  # -----------------------------------------------------
  alert {
    # Cooldown period in minutes
    cooldown-minutes = 60
    # Max alerts per tenant per hour
    max-per-hour = 10
    # Default channels
    channels = ["log"]
  }

  # -----------------------------------------------------
  # Export Configuration
  # -----------------------------------------------------
  export {
    # Maximum export size in bytes (100MB default)
    max-size-bytes = 104857600
    # Default batch size for streaming
    batch-size = 10000
    # Supported formats
    formats = ["csv", "json"]
  }

  # -----------------------------------------------------
  # Sampling Rates by Tenant Tier
  # -----------------------------------------------------
  sampling-rates {
    FREE = 0.05
    BASIC = 0.1
    PROFESSIONAL = 0.5
    ENTERPRISE = 1.0
  }
}